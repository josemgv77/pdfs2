<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plantilla de test por tomo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #e2e8f0;
      --secondary-hover: #cbd5e1;
      --border: #dbe2ea;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
      --warning-bg: #fef3c7;
      --warning-text: #92400e;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #e2e8f0 0%, #f8fafc 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 24px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 4vw, 34px);
    }

    .header p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .content {
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fafc;
    }

    .status-item {
      font-size: 14px;
      color: var(--muted);
    }

    .status-item strong {
      color: var(--text);
    }

    .question-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      background: white;
      display: grid;
      gap: 18px;
    }

    .question-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.4;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .option:hover {
      border-color: var(--primary);
      background: #eff6ff;
      transform: translateY(-1px);
    }

    .option input {
      margin-top: 4px;
      transform: scale(1.1);
    }

    .option.correct {
      border-color: #22c55e;
      background: #f0fdf4;
    }

    .option.incorrect {
      border-color: #ef4444;
      background: #fef2f2;
    }

    .feedback {
      display: none;
      border-radius: 14px;
      padding: 16px;
      line-height: 1.6;
      border: 1px solid transparent;
    }

    .feedback.visible {
      display: block;
    }

    .feedback.correct {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: #86efac;
    }

    .feedback.incorrect {
      background: var(--error-bg);
      color: var(--error-text);
      border-color: #fca5a5;
    }

    .feedback.warning {
      background: var(--warning-bg);
      color: var(--warning-text);
      border-color: #fcd34d;
    }

    .feedback-title {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
    }

    .controls-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: 0.55; transform: none; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--secondary); color: var(--text); }
    .btn-secondary:hover { background: var(--secondary-hover); }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #b91c1c; }

    .results {
      display: none;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      background: #f8fafc;
    }

    .results.visible { display: block; }

    .results h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .results p {
      margin: 8px 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .results strong { color: var(--text); }

    .back-link {
      display: inline-flex;
      margin-top: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 640px) {
      .controls {
        flex-direction: column;
      }

      .controls-group {
        width: 100%;
      }

      .controls-group button {
        flex: 1 1 calc(50% - 12px);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="panel">
      <header class="header">
        <h1 id="test-title">Plantilla de test</h1>
        <p id="test-description">
          Esta plantilla sirve como base para cada tomo. Sustituye las preguntas de ejemplo por las preguntas reales del PDF correspondiente.
        </p>
      </header>

      <div class="content">
        <div class="status-bar" aria-live="polite">
          <div class="status-item"><strong>Tomo:</strong> <span id="status-tomo">—</span></div>
          <div class="status-item"><strong>Pregunta:</strong> <span id="status-question">1 / 1</span></div>
          <div class="status-item"><strong>Respondidas:</strong> <span id="status-answered">0</span></div>
        </div>

        <section class="question-card" aria-labelledby="question-text">
          <h2 id="question-text" class="question-title">Pregunta</h2>
          <div id="options" class="options"></div>
          <div id="feedback" class="feedback" aria-live="polite"></div>
        </section>

        <div class="controls">
          <div class="controls-group">
            <button id="prev-button" class="btn-secondary" type="button">Anterior</button>
            <button id="next-button" class="btn-secondary" type="button">Siguiente</button>
          </div>
          <div class="controls-group">
            <button id="reveal-button" class="btn-primary" type="button">Ver respuesta</button>
            <button id="finish-button" class="btn-danger" type="button">Finalizar</button>
          </div>
        </div>

        <section id="results" class="results" aria-live="polite">
          <h2>Resultado del test</h2>
          <p><strong>Puntuación:</strong> <span id="score"></span></p>
          <p><strong>Aciertos:</strong> <span id="hits"></span></p>
          <p><strong>Fallos:</strong> <span id="errors"></span></p>
          <p><strong>Sin responder:</strong> <span id="blank"></span></p>
          <a class="back-link" href="./index.html">← Volver al índice de tomos</a>
        </section>
      </div>
    </section>
  </main>

  <script>
    window.TEST_CONFIG = {
      tomoId: 'plantilla',
      title: 'Plantilla de test por tomo',
      description: 'Ejemplo base reutilizable para cualquier tomo del repositorio.',
      questions: [
        {
          text: '¿Qué elemento debes modificar para adaptar esta plantilla a un tomo real?',
          options: [
            'Solo el color de fondo de la página',
            'El array de preguntas, respuestas correctas y explicaciones',
            'Únicamente el título del navegador',
            'Nada, la plantilla ya lee automáticamente el PDF'
          ],
          correctIndex: 1,
          explanation: 'Para convertir la plantilla en un test real debes sustituir las preguntas de ejemplo por las preguntas reales del tomo, indicando opciones, respuesta correcta y explicación.'
        },
        {
          text: '¿Qué debe ocurrir al pulsar el botón “Ver respuesta”?',
          options: [
            'Se cierra el test automáticamente',
            'Se borra la selección del usuario',
            'Se muestra si la respuesta es correcta o incorrecta y la explicación',
            'Se pasa siempre a la siguiente pregunta'
          ],
          correctIndex: 2,
          explanation: 'La plantilla está diseñada para evaluar la respuesta marcada, indicar si es correcta o incorrecta, mostrar cuál es la opción válida y explicar el motivo.'
        },
        {
          text: '¿Qué información muestra el bloque final de resultados?',
          options: [
            'Puntuación, aciertos, fallos y preguntas sin responder',
            'Solo el nombre del tomo',
            'El contenido completo del PDF',
            'Únicamente las preguntas acertadas'
          ],
          correctIndex: 0,
          explanation: 'Al finalizar, el resumen del test debe ayudar a revisar el rendimiento global mostrando puntuación, número de aciertos, errores y preguntas en blanco.'
        }
      ]
    };
  </script>
  <script src="./app.js"></script>
</body>
</html>
